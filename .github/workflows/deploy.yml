name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at the same time; a newer push waits for the current one
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Pull, build and restart on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            cd /www/wwwroot/twinscloud.com/Twins_cloud-website
            # Refuse to deploy over manual edits on the server instead of silently keeping them
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "Server has uncommitted changes, aborting deploy:"
              git status --short --untracked-files=no
              exit 1
            fi
            git pull --ff-only origin main
            bash deploy.sh
